# Настройки инструментов разработки. Сторонних зависимостей у программы нет;
# линтер и проверка типов ставятся отдельно: pip install -r requirements-dev.txt

[tool.ruff]
line-length = 79            # PEP 8
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: ошибки оформления
    "W",    # pycodestyle: предупреждения
    "F",    # pyflakes: неиспользуемые импорты и переменные, опечатки в именах
    "I",    # порядок импортов (isort)
    "N",    # имена по PEP 8
    "B",    # частые ошибки (bugbear)
    "UP",   # устаревшие конструкции
    "SIM",  # упрощения
    "C4",   # генераторы и литералы коллекций
]
ignore = [
    "SIM108",   # тернарный оператор не всегда читается лучше, чем if/else
]

[tool.ruff.lint.per-file-ignores]
"coach/powershell_scripts.py" = ["E501"]    # код PowerShell внутри строк

[tool.mypy]
python_version = "3.10"
files = ["coach", "main.py", "tools"]
check_untyped_defs = true
