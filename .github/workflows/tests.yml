name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Стиль кода и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: PEP 8 и частые ошибки (ruff)
        run: ruff check .
      - name: Форматирование (ruff format)
        run: ruff format --check .
      - name: Типы (mypy)
        run: mypy

  test:
    name: Тесты
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Проверка синтаксиса всех модулей
        run: python -m compileall -q main.py coach tools tests
      # -X warn_default_encoding + error::EncodingWarning: тест упадёт на любом
      # чтении/записи файла без явной кодировки — даже на Linux, где это незаметно.
      - name: Тесты
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest -v
